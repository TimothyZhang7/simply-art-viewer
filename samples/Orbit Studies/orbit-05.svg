<g class="g2"><circle cx="800" cy="450" r="378.0" fill="none" stroke="#ef7a85" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="10 18"/><circle cx="1178.0" cy="450" r="12" fill="#ef7a85"/><circle cx="800" cy="72.0" r="5.4" fill="#ef7a85" fill-opacity="0.55"/></g>
<circle cx="800" cy="450" r="49.8" fill="#8ea8ff"/>
