<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
<style>@keyframes br { from { transform: scale(0.82); opacity: 0.55 } to { transform: scale(1.14); opacity: 0.95 } }
.b0{animation:br 5s ease-in-out 0.0s infinite alternate;transform-origin:280px 252px}
.b1{animation:br 7s ease-in-out -1.7s infinite alternate;transform-origin:799px 594px}
.b2{animation:br 9s ease-in-out -3.4s infinite alternate;transform-origin:478px 937px}
.b3{animation:br 11s ease-in-out -5.1s infinite alternate;transform-origin:997px 383px}
.b4{animation:br 5s ease-in-out -6.8s infinite alternate;transform-origin:676px 725px}
</style>
<rect width="1400" height="1400" fill="#101318"/>
<defs><radialGradient id="g0"><stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/></radialGradient><radialGradient id="g1"><stop offset="0%" stop-color="#8ea8ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#8ea8ff" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0%" stop-color="#ef7a85" stop-opacity="0.9"/><stop offset="100%" stop-color="#ef7a85" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0%" stop-color="#ffd166" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/></radialGradient><radialGradient id="g4"><stop offset="0%" stop-color="#8ea8ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#8ea8ff" stop-opacity="0"/></radialGradient></defs>
<circle class="b0" cx="280" cy="252" r="224" fill="url(#g0)"/>
<circle class="b1" cx="799" cy="594" r="350" fill="url(#g1)"/>
<circle class="b2" cx="478" cy="937" r="476" fill="url(#g2)"/>
<circle class="b3" cx="997" cy="383" r="224" fill="url(#g3)"/>
<circle class="b4" cx="676" cy="725" r="350" fill="url(#g4)"/>

</svg>