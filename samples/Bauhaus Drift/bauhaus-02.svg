<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>@keyframes spin { to { transform: rotate(360deg) } }
@keyframes sway { from { transform: translateY(-27px) } to { transform: translateY(27px) } }
.slow{animation:spin 48s linear infinite;transform-origin:800px 450px}
.mid{animation:spin 27s linear infinite reverse;transform-origin:512px 270px}
.sw{animation:sway 7s ease-in-out infinite alternate}</style>
<rect width="1600" height="900" fill="#0e1016"/>

<g class="slow">
  <rect x="566" y="216" width="468" height="468" fill="none" stroke="#9ee6d0" stroke-width="10"/>
  <rect x="683" y="333" width="234" height="234" fill="#f1dec0" transform="rotate(25 800 450)"/>
</g>
<g class="mid">
  <path d="M 350 270 a 162 162 0 0 1 324 0 Z" fill="#7f9cf5"/>
</g>
<g class="sw">
  <circle cx="1152" cy="648" r="96" fill="#9ee6d0"/>
  <path d="M 288 702 l 144 -108 l 18 180 Z" fill="#f1dec0" fill-opacity="0.85"/>
</g>
</svg>