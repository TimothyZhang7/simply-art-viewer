<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
<style>@keyframes spin { to { transform: rotate(360deg) } }
@keyframes sway { from { transform: translateY(-42px) } to { transform: translateY(42px) } }
.slow{animation:spin 80s linear infinite;transform-origin:700px 700px}
.mid{animation:spin 47s linear infinite reverse;transform-origin:448px 420px}
.sw{animation:sway 11s ease-in-out infinite alternate}</style>
<rect width="1400" height="1400" fill="#0d0d12"/>

<g class="slow">
  <rect x="336" y="336" width="728" height="728" fill="none" stroke="#e8eaf0" stroke-width="18"/>
  <rect x="518" y="518" width="364" height="364" fill="#8ea8ff" transform="rotate(65 700 700)"/>
</g>
<g class="mid">
  <path d="M 196 420 a 252 252 0 0 1 504 0 Z" fill="#f1dec0"/>
</g>
<g class="sw">
  <circle cx="1008" cy="1008" r="170" fill="#e8eaf0"/>
  <path d="M 252 1092 l 224 -168 l 28 280 Z" fill="#8ea8ff" fill-opacity="0.85"/>
</g>
</svg>