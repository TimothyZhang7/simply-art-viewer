<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>@keyframes spin { to { transform: rotate(360deg) } }
@keyframes sway { from { transform: translateY(-30px) } to { transform: translateY(30px) } }
.slow{animation:spin 72s linear infinite;transform-origin:800px 500px}
.mid{animation:spin 42s linear infinite reverse;transform-origin:512px 300px}
.sw{animation:sway 10s ease-in-out infinite alternate}</style>
<rect width="1600" height="1000" fill="#101318"/>

<g class="slow">
  <rect x="540" y="240" width="520" height="520" fill="none" stroke="#ffd166" stroke-width="16"/>
  <rect x="670" y="370" width="260" height="260" fill="#8ea8ff" transform="rotate(55 800 500)"/>
</g>
<g class="mid">
  <path d="M 332 300 a 180 180 0 0 1 360 0 Z" fill="#ef7a85"/>
</g>
<g class="sw">
  <circle cx="1152" cy="720" r="124" fill="#ffd166"/>
  <path d="M 288 780 l 160 -120 l 20 200 Z" fill="#8ea8ff" fill-opacity="0.85"/>
</g>
</svg>